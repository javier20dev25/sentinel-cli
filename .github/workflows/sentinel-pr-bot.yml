name: Sentinel PR Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Call Sentinel Cloud Engine
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Scanning PR #${{ github.event.pull_request.number }} with Sentinel Cloud Engine"
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"repo\": \"${{ github.repository }}\",
              \"prNumber\": ${{ github.event.pull_request.number }},
              \"provider_token\": \"${{ secrets.GITHUB_TOKEN }}\"
            }" \
            https://sentinel-psi-nine.vercel.app/api/scan/pr)
          echo "$RESPONSE" > /tmp/sentinel_result.json
          echo "::endgroup::"

      - name: Post Sentinel Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('/tmp/sentinel_result.json', 'utf8'));

            if (result.error) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                body: `## 🔴 Sentinel Scan Failed\n\n\`\`\`\n${result.error}\n\`\`\``
              });
              return;
            }

            const score = result.impactScore ?? 0;
            const band = result.riskBand ?? 'UNKNOWN';
            const decision = result.decision ?? 'PASS';
            const findings = result.provenance ?? [];

            const highCrit = findings.filter(f => f.severity === 'HIGH' || f.severity === 'CRITICAL');
            const lowMed = findings.filter(f => f.severity === 'LOW' || f.severity === 'MEDIUM' || f.severity === 'INFO');
            const chains = findings.filter(f => f.type === 'STAGED_KILL_CHAIN');

            let header = '🟢';
            let color = 'brightgreen';
            if (decision === 'BLOCK' || highCrit.length > 0) {
              header = '🔴';
              color = 'red';
            } else if (score >= 30) {
              header = '🟡';
              color = 'yellow';
            }

            let body = `## ${header} Sentinel PR Scan\n\n`;
            body += `**Impact Score:** ${score.toFixed(1)}/100  \n`;
            body += `**Risk Band:** ${band}  \n`;
            body += `**Decision:** ${decision}  \n`;
            body += `**Files Analyzed:** ${result.filesAnalyzed ?? 0}  \n\n`;

            if (chains.length > 0) {
              body += `### 🚨 Kill Chains Detected\n\n`;
              for (const c of chains) {
                body += `- **${c.type}** — ${c.description}\\n`;
              }
              body += '\n';
            }

            if (highCrit.length > 0) {
              body += `### ⚠️ HIGH/CRITICAL Findings (${highCrit.length})\n\n`;
              for (const f of highCrit) {
                body += `- **${f.severity}** \`${f.type}\` — ${f._file}:${f.line_number}\\n`;
                body += `  > ${f.description}\\n`;
                if (f.snippet) {
                  body += `  \\\`\`\`\\n${f.snippet.substring(0, 200)}\\n\\\`\`\`\\n`;
                }
                body += '\\n';
              }
            }

            if (lowMed.length > 0) {
              body += `### ℹ️ LOW/MEDIUM (${lowMed.length})\n\n`;
              const byType = {};
              for (const f of lowMed) {
                byType[f.type] = (byType[f.type] || 0) + 1;
              }
              for (const [type, count] of Object.entries(byType)) {
                body += `- \`${type}\`: ${count}\\n`;
              }
              body += '\\n';
            }

            if (highCrit.length === 0 && chains.length === 0) {
              body += `### ✅ No threats detected\n\n`;
            }

            body += `---\\n`;
            body += `_Scanned by [Sentinel Cloud Engine](https://sentinel-psi-nine.vercel.app) | Hash: \`${result.contentHash?.substring(0, 12) ?? 'N/A'}...\`_`;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

            if (decision === 'BLOCK') {
              await github.rest.checks.create({
                ...context.repo,
                name: 'Sentinel Security Audit',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: 'Sentinel blocked this PR',
                  summary: `${highCrit.length} HIGH/CRITICAL findings detected. Review the PR comment for details.`,
                  text: JSON.stringify(result, null, 2)
                }
              });
              core.setFailed('Sentinel blocked this PR due to security findings.');
            } else if (highCrit.length > 0) {
              await github.rest.checks.create({
                ...context.repo,
                name: 'Sentinel Security Audit',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed',
                conclusion: 'neutral',
                output: {
                  title: 'Sentinel found issues',
                  summary: `${highCrit.length} HIGH/CRITICAL findings. Review recommended before merging.`,
                  text: JSON.stringify(result, null, 2)
                }
              });
            } else {
              await github.rest.checks.create({
                ...context.repo,
                name: 'Sentinel Security Audit',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'Sentinel passed this PR',
                  summary: 'No security threats detected.',
                  text: JSON.stringify(result, null, 2)
                }
              });
            }
