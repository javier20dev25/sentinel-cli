name: 'Sentinel PR Audit'
description: 'Scan a GitHub pull request for security threats and post findings as a PR comment with Check Run status.'
author: 'Sentinel Security'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  sentinel-version:
    description: 'Version of @sentinel/cli to install (npm install -g @sentinel/cli@<version>)'
    required: false
    default: 'latest'
  github-token:
    description: 'GitHub token for API calls (defaults to github.token)'
    required: false
    default: '${{ github.token }}'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        persist-credentials: false

    - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.3.0
      with:
        node-version: 20

    - name: Install Sentinel CLI
      shell: bash
      env:
        SENTINEL_VERSION: ${{ inputs.sentinel-version }}
      run: |
        npm install -g @sentinel/cli@"$SENTINEL_VERSION"

    - name: Audit PR
      id: audit
      shell: bash
      env:
        SENTINEL_REPO: ${{ github.repository }}
        SENTINEL_PR: ${{ github.event.pull_request.number }}
        SENTINEL_AUTHOR: ${{ github.event.pull_request.user.login }}
        SENTINEL_COMMENT: 'true'
        SENTINEL_CHECK_RUN: 'true'
        SENTINEL_OUTPUT: /tmp/sentinel-result.json
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        sentinel pr-audit

    - name: Report failure
      if: failure() && steps.audit.outcome == 'failure'
      shell: bash
      run: |
        echo "::error::Sentinel PR audit failed — review the PR comment for details."
